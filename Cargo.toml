[package]
name = "counterclaw"
version = "0.1.0"
edition = "2021"
description = "OS-level daemon protecting machines from autonomous AI agent data exfiltration"
license = "Apache-2.0"
repository = "https://github.com/Chiicharlito/counterclaw"
homepage = "https://github.com/Chiicharlito/counterclaw"
readme = "README.md"
keywords = ["security", "ai-agent", "daemon", "cdp-proxy", "monitoring"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket (CDP Proxy)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# HTTP server (dashboard + CDP HTTP discovery)
axum = "0.8"
tower = "0.5"

# Filesystem watching
notify = "7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Regex pattern matching
regex = "1"

# Glob patterns
glob = "0.3"

# Dates
chrono = { version = "0.4", features = ["serde"] }

# Process monitoring
sysinfo = "0.32"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client (webhooks)
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async trait support
async-trait = "0.1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# URL parsing
url = "2"

# Home directory resolution
dirs = "6"

[dev-dependencies]
# Temp directories for test isolation
tempfile = "3"

# CLI integration testing (run the binary, check output)
assert_cmd = "2"
predicates = "3"
